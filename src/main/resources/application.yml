spring:
  application:
    name: api-gateway

  # config:
  #   import: "configserver:http://config-server.eventsphere.internal:8888"

  cloud:
    gateway:
      default-filters:
        - name: Retry
          args:
            retries: 3
            statuses: BAD_GATEWAY, SERVICE_UNAVAILABLE, GATEWAY_TIMEOUT
            methods: GET, POST
            backoff:
              firstBackoff: 100ms
              maxBackoff: 500ms
              factor: 2
              basedOnPreviousValue: false
      server:
        webflux:
          routes:
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/users/**
              filters:
                - StripPrefix=1

            - id: event-booking-service
              uri: lb://event-booking-service
              predicates:
                - Path=/api/events/**,/api/ticket-types/**,/api/bookings/**
              filters:
                - StripPrefix=1

            - id: review-notification-service-multipart
              uri: lb://review-notification-service
              order: -1
              predicates:
                - Path=/api/reviews
                - Method=POST
              filters:
                - StripPrefix=1

            - id: review-notification-service
              uri: lb://review-notification-service
              predicates:
                - Path=/api/reviews/**
              filters:
                - StripPrefix=1

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway,loggers,threaddump,heapdump,env,configprops,beans,mappings,refresh

  endpoint:
    health:
      show-details: always
      show-components: always

    gateway:
      enabled: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.loadbalancer: DEBUG
    com.netflix.discovery: INFO
